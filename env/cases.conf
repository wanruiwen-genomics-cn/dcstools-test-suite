# Per-machine settings for the case scripts under cases/.
# Copied in by cases/common.sh; every value can also be overridden from the
# environment, e.g.  THREADS=32 cases/wgs_human_small.sh

# Release bundle under test. This is the artefact the whole suite validates, so
# point it at a freshly unpacked tarball rather than a build tree.
DCS_HOME=${DCS_HOME:-/data/disk2/private/wanruiwen/dcstools/dcs-archive/dcs-tools}

# Golden reference bundle. Used when generating baselines with --update-golden:
#   DCS_HOME=$GOLDEN_DCS_HOME ./run.sh --tier full --update-golden
# Then switch DCS_HOME back to the release candidate and run without
# --update-golden to compare.
GOLDEN_DCS_HOME=${GOLDEN_DCS_HOME:-/data/disk2/private/wanruiwen/dcstools/dcs-tools}

# License proxy. Every dcs tool refuses to run without it.
PROXY_HOST=${PROXY_HOST:-127.0.0.1:8909}

# Root of the test datasets. The layout the cases expect:
#   $DATA_ROOT/ref/<name>.fa              reference + its index files
#   $DATA_ROOT/fastq/<sample>.r{1,2}.fq.gz
#   $DATA_ROOT/known_sites/*.vcf.gz       for bqsr
#   $DATA_ROOT/gvcf/*.g.vcf.gz            for jointcall
#   $DATA_ROOT/bam/{tumor,normal}.align.bam
#   $DATA_ROOT/target.bed                 for the WES case
#
# The heavy cases use per-dataset subdirectories so several genomes can live
# under one DATA_ROOT without colliding on ref/ or fastq/. Override the
# subdirectory with an env var if the data lives elsewhere:
#   $DATA_ROOT/wgs30x/         WGS30X_DATA overrides
#     ref/hg38.fa, fastq/<sample>.r{1,2}.fq.gz, known_sites/*.vcf.gz (optional)
#   $DATA_ROOT/cycas/          CYCAS_DATA overrides
#     ref/cycas.fa, fastq/<sample>.r{1,2}.fq.gz, known_sites/*.vcf.gz (optional)
#   $DATA_ROOT/wheat/          WHEAT_DATA / WHEAT_FQ1 / WHEAT_FQ2 override
#     ref/Triticum_aestivum_refseqv2.fa (or wheat.fa),
#     fastq/<sample>.r{1,2}.fq.gz, known_sites/*.vcf.gz (optional)
#   $DATA_ROOT/potato/         POTATO_DATA overrides
#     ref/potato.fa, fastq/<sample>.r{1,2}.fq.gz, known_sites/*.vcf.gz (optional)
DATA_ROOT=${DATA_ROOT:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/quick_start_data}

# Wheat (Triticum aestivum). The reference + ERT index live under
# dcstools_data/Triticum_aestivum; the 0.5x FASTQ pair is next door in
# xueqinwen/test_wheat. Override any of these if the data moves.
WHEAT_DATA=${WHEAT_DATA:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/Triticum_aestivum}
WHEAT_FQ1=${WHEAT_FQ1:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/xueqinwen/test_wheat/ERR15334927_1_0.5x.fastq.gz}
WHEAT_FQ2=${WHEAT_FQ2:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/xueqinwen/test_wheat/ERR15334927_2_0.5x.fastq.gz}

# Golden baselines. One subdirectory per case; created by --update-golden.
# Kept on the large shared volume (quota may report full but writes still work).
GOLDEN_ROOT=${GOLDEN_ROOT:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/golden}

# 30x human WGS dataset (FASTQ + optional known_sites). Override per machine.
WGS30X_DATA=${WGS30X_DATA:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/HG001_30x}

# Aligner index mode refs for the 30x ERT / minibwa cases.
WGS30X_ERT_REF=${WGS30X_ERT_REF:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/ref_ert/hg38.fa}
WGS30X_MINIBWA_REF=${WGS30X_MINIBWA_REF:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/ref_minibwa/hg38.fa}

# Rice (Oryza sativa, IRGSP-1.0) WGS dataset. Reads are uncompressed .fastq at
# the dataset root; ref under ref/. Each index mode builds in its own
# index_<mode> folder so sidecars never collide.
RICE_DATA=${RICE_DATA:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/Oryza_sativa}
RICE_REF=${RICE_REF:-$RICE_DATA/ref/Oryza_sativa.IRGSP-1.0.dna_rm.toplevel.fa}
RICE_FQ1=${RICE_FQ1:-$RICE_DATA/SRR32814349_1.fastq}
RICE_FQ2=${RICE_FQ2:-$RICE_DATA/SRR32814349_2.fastq}

# Mouse (GRCm39) WGS dataset. Ref ships gzipped; each script decompresses it
# once into ref/ and hardlinks the plain fa into its index_<mode> folder.
MOUSE_DATA=${MOUSE_DATA:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/data/mouse}
MOUSE_REF=${MOUSE_REF:-$MOUSE_DATA/ref/GCF_000001635.27_GRCm39_genomic.fna.gz}
MOUSE_FQ1=${MOUSE_FQ1:-$MOUSE_DATA/fastq/CFW_0284_S8_L002_R1_001.fastq.gz.1}
MOUSE_FQ2=${MOUSE_FQ2:-$MOUSE_DATA/fastq/CFW_0284_S8_L002_R2_001.fastq.gz.1}

# Potato (Solanum tuberosum, SolTub_3.0) WGS dataset. Tetraploid (ploidy 4).
# Data lives in yangqi4's project dir (read-only for us); the DCS index for each
# mode is built under POTATO_IDX_ROOT (writable, same /zdswhst2 fs so the ref
# can be hardlinked in and sidecars land beside it).
POTATO_DATA=${POTATO_DATA:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/yangqi4/project/07.dcs/01.variantcaller_ploidy/data}
POTATO_REF=${POTATO_REF:-$POTATO_DATA/bwa-mem2-index/Solanum_tuberosum.SolTub_3.0.dna_rm.toplevel.fa}
POTATO_FQ1=${POTATO_FQ1:-$POTATO_DATA/SRR14400529.fastq/SRR14400529_1.fastq.gz}
POTATO_FQ2=${POTATO_FQ2:-$POTATO_DATA/SRR14400529.fastq/SRR14400529_2.fastq.gz}
POTATO_IDX_ROOT=${POTATO_IDX_ROOT:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/potato_indexes}

# Where each run writes its products and report. Kept on the shared volume
# (quota may report full but writes still work); /data/disk2 has no room for
# whole-genome work dirs.
WORK_ROOT=${WORK_ROOT:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/wanruiwen/dcstools_data/work}
REPORT_ROOT=${REPORT_ROOT:-$SUITE_ROOT/reports}

THREADS=${THREADS:-32}

# genotyper is pinned to 1 thread by default. Its QualByDepth port keeps GATK's
# fixTooHighQD jitter (raw QD >= 35 -> 30 + nextGaussian()*3) and the gaussian
# RNG is a process-wide singleton, so with >=2 worker threads the draw order --
# and thus which locus gets which jittered QD -- depends on thread scheduling.
# Verified 2026-09-30 (scripts/genotyper_consistency.sh): same gVCF genotyped
# twice, 32 threads -> 874k QD-only diffs on the 30x set; 1 thread -> identical.
# Cost is modest (30x human genotype step: ~46s -> ~200s). Override with
# GENOTYPER_THREADS=<n> if nondeterministic QD is acceptable for a run.
GENOTYPER_THREADS=${GENOTYPER_THREADS:-1}

# jointcall needs JDK 8 and spark-submit on PATH; leave empty to let the case
# skip itself with a clear message rather than fail.
JAVA8_HOME=${JAVA8_HOME:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/yangqi4/shared/software/jdk8u452-b09}
SPARK_BIN=${SPARK_BIN:-/zdswhst2/ST_BIOINTEL/P24Z32400N0004/yangqi4/shared/software/spark-2.4.5-bin-hadoop2.6/bin}
